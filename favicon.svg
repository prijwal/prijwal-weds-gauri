<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- soft blush squircle -->
  <rect width="64" height="64" rx="18" fill="#F3D9DC"/>
  <!-- leaves: three simple pointed shapes -->
  <g fill="#7C9A7A">
    <path d="M32 27 C24 26 18 21 17 13 C25 13 31 18 32 27 Z"/>
    <path d="M32 27 C40 26 46 21 47 13 C39 13 33 18 32 27 Z"/>
    <path d="M32 27 C28.5 22 28.5 15 32 9 C35.5 15 35.5 22 32 27 Z"/>
  </g>
  <!-- coconut -->
  <circle cx="32" cy="20.5" r="4.6" fill="#B5556A"/>
  <!-- rim -->
  <rect x="21" y="27" width="22" height="5" rx="2.5" fill="#8C6D3B"/>
  <!-- pot: one rounded silhouette -->
  <path d="M25 32 H39 C39 34 41 35 44 36 C48 38 50 44 48 50 C46 55 40 57 32 57 C24 57 18 55 16 50 C14 44 16 38 20 36 C23 35 25 34 25 32 Z" fill="#C9A96E"/>
  <!-- single ivory highlight line -->
  <path d="M21 46 Q32 49 43 46" fill="none" stroke="#FBF7F1" stroke-width="2" stroke-linecap="round" opacity=".85"/>
</svg>
